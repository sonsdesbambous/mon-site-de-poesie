backend:
  name: github
  repo: sonsdesbambous/mon-site-de-poesie
  branch: main
  base_url: https://cms-oauth.minhphuong.workers.dev
  auth_endpoint: auth

media_folder: static/audio
public_folder: /audio

locale: fr

collections:
  - name: "poems"
    label: "Poèmes"
    label_singular: "Poème"
    folder: "content/poems"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.title_vi}} · {{title}} — {{fields.auteur}}"
    preview_path: "poems/{{slug}}"
    fields:
      - label: "Titre vietnamien"
        name: "title_vi"
        widget: "string"
        hint: "Ex : Đây mùa thu tới"
      - label: "Titre français"
        name: "title"
        widget: "string"
        hint: "Ex : Voici l'automne arrivé"
      - label: "Auteur"
        name: "auteur"
        widget: "string"
        hint: "Ex : Xuân Diệu"
      - label: "Année"
        name: "annee"
        widget: "string"
        required: false
        hint: "Ex : 1938"
      - label: "Genre / forme"
        name: "genre"
        widget: "string"
        required: false
        hint: "Ex : Poème contemporain"
      - label: "Étiquettes (tags)"
        name: "tags"
        widget: "list"
        field:
          label: "Tag"
          name: "tag"
          widget: "string"
        hint: "Ex : Automne, Nature, Mélancolie"
      - label: "Texte original (vietnamien)"
        name: "texte_vi"
        widget: "text"
        hint: "Collez le poème original. Laissez une ligne vide entre chaque strophe."
      - label: "Traductions"
        name: "traductions"
        widget: "list"
        label_singular: "Traduction"
        summary: "{{fields.traducteur}}"
        fields:
          - label: "Traducteur / traductrice"
            name: "traducteur"
            widget: "string"
            required: false
            hint: "Ex : Prisca Nguyên"
          - label: "Texte traduit (français)"
            name: "texte_fr"
            widget: "text"
            hint: "Laissez une ligne vide entre chaque strophe."
          - label: "Note du traducteur"
            name: "note_traducteur"
            widget: "text"
            required: false
            hint: "Explications sur les allusions culturelles, références historiques, etc."
      - label: "Fichier audio (ngâm thơ)"
        name: "audio"
        widget: "file"
        required: false
        media_library:
          config:
            multiple: false
        hint: "Format MP3 recommandé. Le fichier sera stocké dans /static/audio/"
      - label: "Vidéo YouTube (ID seulement)"
        name: "video_id"
        widget: "string"
        required: false
        hint: "Copiez uniquement l'ID, ex : dQw4w9WgXcQ (pas l'URL entière)"
      - label: "Voix de la récitation"
        name: "voix"
        widget: "string"
        required: false
        hint: "Ex : Lilas Nguyên (affiché sous le lecteur audio)"
      - label: "Extrait (affiché sur la page d'accueil)"
        name: "extrait"
        widget: "text"
        required: false
        hint: "Điền 2 câu muốn hiển thị. Để trống sẽ tự lấy 2 câu đầu bản dịch."
      - label: "Mettre à la une (Bài thơ của ngày)"
        name: "featured"
        widget: "boolean"
        required: false
        default: false
        hint: "Bật nút này nếu muốn bài thơ xuất hiện ở mục tiêu điểm trên trang chủ"
      - label: "Date de publication sur le site"
        name: "date"
        widget: "datetime"
        default: ""
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Garder en brouillon"
        name: "draft"
        widget: "boolean"
        default: true
        hint: "Décochez pour publier ce poème"

  - name: "auteurs"
    label: "Auteurs"
    label_singular: "Auteur"
    folder: "content/auteurs"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Nom"
        name: "title"
        widget: "string"
        hint: "Ex : Hồ Xuân Hương"
      - label: "Dates"
        name: "dates"
        widget: "string"
        required: false
        hint: "Ex : 1772–1822"
      - label: "Présentation courte"
        name: "bio_courte"
        widget: "text"
        required: false
        hint: "1-2 phrases affichées sous le nom sur la page du poème"
      - label: "Biographie complète"
        name: "bio"
        widget: "text"
        required: false
