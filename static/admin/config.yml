backend:
  name: github
  repo: sonsdesbambous/mon-site-de-poesie
  branch: main
  base_url: https://cms-oauth.minhphuong.workers.dev
  auth_endpoint: auth

media_folder: static/audio
public_folder: /audio

locale: fr

collections:
  - name: "poems"
    label: "Poèmes"
    label_singular: "Poème"
    folder: "content/poems"
    create: true
    slug: "{{slug}}"
    preview_path: "poems/{{slug}}"
    fields:

      - label: "Titre vietnamien"
        name: "title"
        widget: "string"
        hint: "Ex : Thu sơ"

      - label: "Titre français"
        name: "title_fr"
        widget: "string"
        hint: "Ex : Automne précoce"

      - label: "Auteur"
        name: "auteur"
        widget: "string"
        hint: "Ex : Nguyễn Du"

      - label: "Année"
        name: "annee"
        widget: "string"
        hint: "Ex : 1820 ou XVIIIe s."

      - label: "Genre / forme"
        name: "genre"
        widget: "string"
        required: false
        hint: "Ex : Lục bát · Poème classique"

      - label: "Étiquettes (tags)"
        name: "tags"
        widget: "list"
        field:
          label: "Tag"
          name: "tag"
          widget: "string"
        hint: "Ex : Automne, Nature, Mélancolie"

      - label: "Texte original (vietnamien)"
        name: "texte_vi"
        widget: "text"
        hint: "Collez le poème original. Laissez une ligne vide entre chaque strophe."

      - label: "Traductions"
        name: "traductions"
        widget: "list"
        label_singular: "Traduction"
        summary: "{{fields.traducteur}}"
        fields:
          - label: "Traducteur / traductrice"
            name: "traducteur"
            widget: "string"
            hint: "Ex : Marie-Hélène Lê"
          - label: "Texte traduit (français)"
            name: "texte_fr"
            widget: "text"
            hint: "Laissez une ligne vide entre chaque strophe."

      - label: "Fichier audio (ngâm thơ)"
        name: "audio"
        widget: "file"
        required: false
        media_library:
          config:
            multiple: false
        hint: "Format MP3 recommandé. Le fichier sera stocké dans /static/audio/"

      - label: "Vidéo YouTube (ID seulement)"
        name: "video_id"
        widget: "string"
        required: false
        hint: "Copiez uniquement l'ID, ex : dQw4w9WgXcQ (pas l'URL entière)"

      - label: "Voix de la récitation"
        name: "voix"
        widget: "string"
        required: false
        hint: "Ex : Trần Thị Lan (affiché sous le lecteur audio)"

      - label: "Extrait (affiché sur la page d'accueil)"
        name: "extrait_index"
        widget: "number"
        default: 0
        hint: "0 = câu đầu, 1 = câu thứ 2..."

      - label: "Date de publication sur le site"
        name: "date"
        widget: "datetime"
        default: ""
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "Publié"
        name: "draft"
        widget: "boolean"
        default: false
        hint: "Décochez pour mettre en brouillon"
